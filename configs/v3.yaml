# V3: Non-equivariant conditional flow matching (MLP + cubic rotation augmentation)
variant: v3

model:
  dim_hidden: 256
  n_layers: 6
  time_embed_dim: 64
  ode_rtol: 1.0e-4
  ode_atol: 1.0e-5

training:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  total_steps: 10000
  warmup_fraction: 0.05
  val_every: 500
  log_every: 100
  grad_clip: 1.0
  batch_size: 1
  accumulation_steps: 32  # effective batch = 32

data:
  n_train: 4000
  n_val: 500
  n_test: 500
  patch_size: 8
  k_neighbours: 26
  num_workers: 4
  seed: 42
  use_jhtdb: false
  jhtdb_token: ""
  jhtdb_cache_dir: "./jhtdb_cache"
  jhtdb_time_idx: 0

out_dir: "./runs/v3"
