# V1: SE(3)-equivariant conditional flow matching
variant: v1

model:
  irreps_hidden: "32x0e + 16x1o + 8x2e"  # ~5M params
  n_layers: 5
  lmax_sh: 2
  n_radial_hidden: 64
  ode_rtol: 1.0e-4
  ode_atol: 1.0e-5

training:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  total_steps: 50000
  warmup_fraction: 0.05
  val_every: 500
  log_every: 100
  grad_clip: 1.0
  batch_size: 8
  accumulation_steps: 4  # effective batch = 32

data:
  n_train: 4000
  n_val: 500
  n_test: 500
  patch_size: 8
  k_neighbours: 26
  num_workers: 4
  seed: 42
  use_jhtdb: false        # set true to download from JHTDB
  jhtdb_token: ""
  jhtdb_cache_dir: "./jhtdb_cache"
  jhtdb_time_idx: 0

out_dir: "./runs/v1"
