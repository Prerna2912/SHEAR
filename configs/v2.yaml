# V2: SE(3)-equivariant deterministic regression (same backbone as V1, MSE loss)
variant: v2

model:
  irreps_hidden: "16x0e + 8x1e + 4x2e"  # ~1.3M params (hardware fallback per spec)
  n_layers: 4
  lmax_sh: 2
  n_radial_hidden: 64

training:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  total_steps: 10000
  warmup_fraction: 0.05
  val_every: 500
  log_every: 100
  grad_clip: 1.0
  batch_size: 1
  accumulation_steps: 32  # effective batch = 32

data:
  n_train: 4000
  n_val: 500
  n_test: 500
  patch_size: 8
  k_neighbours: 26
  num_workers: 4
  seed: 42
  use_jhtdb: false
  jhtdb_token: ""
  jhtdb_cache_dir: "./jhtdb_cache"
  jhtdb_time_idx: 0

out_dir: "./runs/v2"
